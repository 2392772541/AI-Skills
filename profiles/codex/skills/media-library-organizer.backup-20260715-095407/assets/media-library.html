.video-stage{padding:16px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.55fr);gap:16px}.video-box{position:relative;aspect-ratio:16/9;background:#02070d;border:1px solid #233f57;border-radius:9px;overflow:hidden}.video-box video{width:100%;height:100%;object-fit:contain;background:#000}.video-side{border:1px solid var(--line);background:#091827;border-radius:9px;padding:14px}.detail-title{font-size:12px;font-weight:700}.detail-list{margin-top:13px;display:grid;gap:11px}.detail-row label{display:block;font-size:9px;color:#6f8598;margin-bottom:4px}.detail-row div{font-size:10px;color:#d4e0e8}.video-timeline{height:64px;margin:0 16px 14px;display:flex;border:1px solid #29455d;border-radius:8px;overflow:hidden;position:relative}.video-segment{height:100%;border:0;border-right:1px solid #29455d;background:var(--seg-bg);cursor:pointer;color:#eaf1f5;font-size:9px;position:relative}.video-segment.active{outline:2px solid var(--seg);outline-offset:-2px}.video-segment span{display:block;margin-top:4px;color:#aebdca}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"><span class="icon">&#xF1B2;</span></div><div><div class="brand-title">素材片段库</div><div class="brand-sub">音频 · 视频 · 图片统一管理</div></div></div>
    <nav class="media-nav" aria-label="素材类型">
      <button class="media-tab" data-mode="audio" aria-selected="true"><span class="icon">&#xF001;</span><span>音乐片段</span><span class="media-count" id="audioCount"></span></button>
      <button class="media-tab" data-mode="video" aria-selected="false"><span class="icon">&#xF03D;</span><span>视频片段</span><span class="media-count" id="videoCount"></span></button>
      <button class="media-tab" data-mode="image" aria-selected="false"><span class="icon">&#xF03E;</span><span>图片素材</span><span class="media-count" id="imageCount"></span></button>
    </nav>
    <div class="filters" id="filters"></div>
    <div class="queue"><div class="queue-head"><span id="queueLabel">匹配片段</span><span id="queueCount"></span></div><div class="queue-list" id="queueList"></div></div>
  </aside>
  <main class="workspace">
    <header class="topbar"><div class="search-wrap"><span class="icon search-icon">&#xF002;</span><input class="search" id="search" type="search" placeholder="搜索歌曲、场景、人物、产品或用途"><button class="clear-search" id="clearSearch" type="button" aria-label="清除搜索"><span class="icon">&#xF00D;</span></button></div><div class="view-label">当前工作区 <strong id="viewLabel">音乐片段</strong></div><div class="top-stats" id="topStats"></div></header>
    <div class="content">
      <section class="view active" id="audioView">
        <div class="card" id="audioCard">
          <div class="card-head"><div><div class="title" id="audioTitle"></div><div class="sub" id="audioSub"></div></div><div class="head-actions"><button class="icon-btn" id="audioSave" type="button" aria-label="收藏"><span class="icon">&#xF02E;</span></button><button class="icon-btn" id="audioCopy" type="button" aria-label="复制片段信息"><span class="icon">&#xF0C5;</span></button></div></div>
          <div class="timeline-wrap"><div class="ruler" id="audioRuler"></div><div class="timeline" id="audioTimeline"><div class="segments" id="audioSegments"></div><canvas class="wave" id="audioWave"></canvas><div class="playhead" id="audioPlayhead"></div></div><div class="overview" id="audioOverview"><canvas id="audioOverviewWave"></canvas><div class="overview-fill" id="audioOverviewFill"></div></div></div>
          <div class="transport"><div class="transport-left"><button class="transport-btn" id="audioPrev" type="button"><span class="icon">&#xF048;</span></button><button class="transport-btn play" id="audioPlay" type="button"><span class="icon" id="audioPlayIcon">&#xF04B;</span></button><button class="transport-btn" id="audioNext" type="button"><span class="icon">&#xF051;</span></button><div class="time"><strong id="audioTime">00:00</strong> <span>/</span> <span id="audioDuration">00:00</span></div><input class="range" id="audioSeek" type="range" min="0" max="1000" value="0"></div><div class="transport-mode"><span class="icon">&#xF0C4;</span>只播片段<input class="toggle" id="audioOnly" type="checkbox" checked><span class="icon">&#xF363;</span>循环<input class="toggle" id="audioLoop" type="checkbox"></div><div class="volume"><span class="icon">&#xF028;</span><input id="audioVolume" type="range" min="0" max="1" step=".05" value=".8"><span>80%</span></div></div>
          <div class="summary"><div class="summary-item"><div class="summary-label">当前片段</div><div class="summary-value" id="audioSummaryRange"></div></div><div class="summary-item"><div class="summary-label">细分情绪</div><div class="summary-value" id="audioSummaryEmotion"></div></div><div class="summary-item"><div class="summary-label">强度</div><div class="summary-value" id="audioSummaryIntensity"></div></div><div class="summary-item"><div class="summary-label">适合画面</div><div class="summary-value" id="audioSummaryScenes"></div></div><div class="summary-item"><div class="summary-label">用途与口播</div><div class="summary-value" id="audioSummaryUses"></div></div></div>
        </div>
        <div class="section-head"><div class="section-title">音乐片段结果 <span id="audioResultCount"></span></div></div><div class="table"><div class="table-head"><div>歌曲 / 片段</div><div>细分情绪</div><div>强度</div><div>适合画面</div><div>口播</div></div><div id="audioRows"></div></div>
      </section>
      <section class="view" id="videoView"><div id="videoContent"></div></section>
      <section class="view" id="imageView"><div id="imageContent"></div></section>
    </div>
  </main>
</div>

<script id="catalog" type="application/json">__CATALOG_JSON__</script>
<script>
const bundle=JSON.parse(document.getElementById('catalog').textContent);const tracks=bundle.audio.tracks||[],videos=bundle.video.videos||[],images=bundle.image.images||[];const $=id=>document.getElementById(id);const audio=$('audio');
const colors=[{s:'#248cff',b:'rgba(36,140,255,.2)'},{s:'#9c6cff',b:'rgba(156,108,255,.2)'},{s:'#eea33d',b:'rgba(238,163,61,.19)'},{s:'#ef6570',b:'rgba(239,101,112,.18)'},{s:'#5b91b7',b:'rgba(91,145,183,.18)'}];
const state={mode:'audio',query:'',filters:{audio:{core:'全部',use:'全部',voice:'全部'},video:{category:'全部',use:'全部',shot:'全部',motion:'全部'},image:{category:'全部',use:'全部',orientation:'全部'}},audioTrack:0,audioSegment:0,videoIndex:0,videoSegment:0,filtered:[]};
const unique=v=>Array.from(new Set(v.filter(Boolean))).sort((a,b)=>a.localeCompare(b,'zh-CN'));const time=v=>{v=Math.max(0,Math.round(Number(v)||0));return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`};const duration=v=>{const p=String(v).split(':').map(Number);return p.length===2?p[0]*60+p[1]:p.length===3?p[0]*3600+p[1]*60+p[2]:Number(v)||0};const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2000)}
function allAudio(){return tracks.flatMap((track,ti)=>track.segments.map((segment,si)=>({type:'audio',track,segment,ti,si})))}function allVideo(){return videos.flatMap((video,vi)=>video.segments.map((segment,si)=>({type:'video',video,segment,vi,si})))}
function activeFilter(){return state.filters[state.mode]}
function filterItems(){const q=state.query.toLowerCase();if(state.mode==='audio'){const f=state.filters.audio;return allAudio().filter(x=>(f.core==='全部'||x.segment.core_emotions.includes(f.core))&&(f.use==='全部'||x.segment.uses.includes(f.use))&&(f.voice==='全部'||x.segment.voiceover_fit===f.voice)&&(!q||[x.track.display_name,x.segment.label,...x.segment.fine_emotions,...x.segment.uses,...x.segment.scenes].join(' ').toLowerCase().includes(q)))}if(state.mode==='video'){const f=state.filters.video;return allVideo().filter(x=>(f.category==='全部'||x.video.category===f.category)&&(f.use==='全部'||x.segment.uses.includes(f.use))&&(f.shot==='全部'||x.segment.shot_type===f.shot)&&(f.motion==='全部'||x.segment.camera_motion===f.motion)&&(!q||[x.video.display_name,x.segment.label,...x.segment.content_tags,...x.segment.uses].join(' ').toLowerCase().includes(q)))}const f=state.filters.image;return images.map((image,ii)=>({type:'image',image,ii})).filter(x=>(f.category==='全部'||x.image.category===f.category)&&(f.use==='全部'||x.image.uses.includes(f.use))&&(f.orientation==='全部'||x.image.orientation===f.orientation)&&(!q||[x.image.display_name,...x.image.content_tags,...x.image.uses].join(' ').toLowerCase().includes(q)))}
function chip(group,key,value){const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=value;b.setAttribute('aria-pressed',String(activeFilter()[key]===value));b.onclick=()=>{activeFilter()[key]=value;renderSidebar();renderCurrent()};group.appendChild(b)}
function group(title,key,values){const wrap=document.createElement('section');wrap.className='filter-group';wrap.innerHTML=`<div class="filter-head"><span>${esc(title)}</span><button type="button">清空</button></div><div class="chips"></div>`;wrap.querySelector('button').onclick=()=>{activeFilter()[key]='全部';renderSidebar();renderCurrent()};const area=wrap.querySelector('.chips');['全部',...unique(values)].forEach(v=>chip(area,key,v));return wrap}
function renderFilters(){const panel=$('filters');panel.replaceChildren();if(state.mode==='audio'){panel.append(group('核心情绪','core',allAudio().flatMap(x=>x.segment.core_emotions)),group('视频用途','use',allAudio().flatMap(x=>x.segment.uses)),group('口播适配','voice',allAudio().map(x=>x.segment.voiceover_fit)))}else if(state.mode==='video'){panel.append(group('视频分类','category',videos.map(x=>x.category)),group('剪辑用途','use',allVideo().flatMap(x=>x.segment.uses)),group('景别','shot',allVideo().map(x=>x.segment.shot_type)),group('运镜','motion',allVideo().map(x=>x.segment.camera_motion)))}else{panel.append(group('图片分类','category',images.map(x=>x.category)),group('使用场景','use',images.flatMap(x=>x.uses)),group('图片方向','orientation',images.map(x=>x.orientation)))}const clear=document.createElement('button');clear.className='clear-all';clear.type='button';clear.innerHTML='<span class="icon">&#xF51A;</span> 清除当前筛选';clear.onclick=()=>{Object.keys(activeFilter()).forEach(k=>activeFilter()[k]='全部');renderSidebar();renderCurrent()};panel.appendChild(clear)}
function renderQueue(){state.filtered=filterItems();$('queueCount').textContent=`${state.filtered.length} 个`;$('queueLabel').textContent=state.mode==='image'?'匹配图片':'匹配片段';const list=$('queueList');list.replaceChildren();state.filtered.slice(0,18).forEach(item=>{const active=item.type==='audio'&&item.ti===state.audioTrack&&item.si===state.audioSegment||item.type==='video'&&item.vi===state.videoIndex&&item.si===state.videoSegment;const b=document.createElement('button');b.className=`queue-item${active?' active':''}`;b.type='button';if(item.type==='audio'){b.innerHTML=`<span class="queue-icon"><span class="icon">&#xF04B;</span></span><span><span class="queue-title">${esc(item.track.display_name)}</span><span class="queue-meta">${esc(item.segment.label)} · ${esc(item.segment.fine_emotions.slice(0,2).join(' · '))}</span></span><span class="queue-time">${time(item.segment.start)}–${time(item.segment.end)}</span>`;b.onclick=()=>selectAudio(item,true)}else if(item.type==='video'){b.innerHTML=`<span class="queue-icon"><span class="icon">&#xF03D;</span></span><span><span class="queue-title">${esc(item.video.display_name)}</span><span class="queue-meta">${esc(item.segment.label)} · ${esc(item.segment.shot_type)}</span></span><span class="queue-time">${time(item.segment.start)}–${time(item.segment.end)}</span>`;b.onclick=()=>selectVideo(item,true)}else{b.innerHTML=`<span class="queue-icon"><span class="icon">&#xF03E;</span></span><span><span class="queue-title">${esc(item.image.display_name)}</span><span class="queue-meta">${esc(item.image.content_tags.slice(0,3).join(' · '))}</span></span><span class="queue-time">查看</span>`;b.onclick=()=>openImage(item.image)}list.appendChild(b)})}
function renderSidebar(){renderFilters();renderQueue();$('topStats').textContent=`音乐 ${tracks.length} · 视频 ${videos.length} · 图片 ${images.length}`}
function setMode(mode){state.mode=mode;document.querySelectorAll('.media-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(`${mode}View`).classList.add('active');$('viewLabel').textContent={audio:'音乐片段',video:'视频片段',image:'图片素材'}[mode];$('search').placeholder={audio:'搜索歌曲、情绪或用途',video:'搜索视频、镜头、场景或用途',image:'搜索图片内容、产品、人物或用途'}[mode];renderSidebar();renderCurrent()}
function audioCurrent(){const track=tracks[state.audioTrack];return track?{track,segment:track.segments[state.audioSegment]}:null}
function selectAudio(item,play=false){const changed=item.ti!==state.audioTrack;state.audioTrack=item.ti;state.audioSegment=item.si;if(changed){audio.src=item.track.relative_path;audio.load()}const go=()=>{audio.currentTime=item.segment.start;updateAudio();if(play)audio.play().catch(()=>toast('浏览器阻止了自动播放，请再点播放'))};if(audio.readyState<2){audio.addEventListener('canplay',go,{once:true});if(audio.networkState===3)audio.load()}else go();renderAudio();renderQueue()}
function renderRuler(el,total){el.replaceChildren();for(let i=0;i<7;i++){const s=document.createElement('span');s.className='tick';s.style.left=`${i/6*100}%`;s.textContent=time(total*i/6);el.appendChild(s)}}
function draw(canvas,peaks,alpha=.7){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);const c=canvas.getContext('2d');c.scale(d,d);c.clearRect(0,0,r.width,r.height);if(!peaks?.length)return;c.fillStyle=`rgba(164,185,201,${alpha})`;const mid=r.height/2,w=Math.max(1,r.width/peaks.length*.62);peaks.forEach((p,i)=>{const h=Math.max(2,p*r.height*.78);c.fillRect(i*r.width/peaks.length,mid-h/2,w,h)})}
function renderAudio(){if(!tracks.length){$('audioView').innerHTML=empty('fa-music','还没有音乐素材','把音频放进 00_待整理 或 03_音频 后运行整理 Skill。');return}const {track,segment}=audioCurrent(),total=duration(track.duration);$('audioTitle').textContent=track.display_name;$('audioSub').textContent=`${track.core_emotions.join(' · ')}　${track.atmosphere.join(' · ')}　${track.duration}`;$('audioSegments').replaceChildren();track.segments.forEach((s,i)=>{const c=colors[i%colors.length],b=document.createElement('button');b.className=`segment${i===state.audioSegment?' active':''}`;b.style.width=`${(s.end-s.start)/total*100}%`;b.style.setProperty('--seg',c.s);b.style.setProperty('--seg-bg',c.b);b.innerHTML=`<span class="seg-index">${i+1}</span><span class="seg-name">${esc(s.label)}</span><span class="seg-use">${esc(s.uses.slice(0,2).join(' · '))}</span><span class="seg-time">${time(s.start)}–${time(s.end)}</span>`;b.onclick=e=>{e.stopPropagation();selectAudio({track,segment:s,ti:state.audioTrack,si:i},true)};$('audioSegments').appendChild(b)});renderRuler($('audioRuler'),total);draw($('audioWave'),track.waveform);draw($('audioOverviewWave'),track.waveform,.58);$('audioDuration').textContent=track.duration;$('audioSummaryRange').textContent=`${time(segment.start)}–${time(segment.end)}（${time(segment.end-segment.start)}）`;$('audioSummaryEmotion').textContent=segment.fine_emotions.join(' · ');$('audioSummaryIntensity').textContent=segment.intensity;$('audioSummaryScenes').textContent=segment.scenes.join('、');$('audioSummaryUses').textContent=`${segment.uses.slice(0,2).join('、')} · 口播${segment.voiceover_fit}`;renderAudioRows();updateAudio()}
function renderAudioRows(){const items=state.mode==='audio'?filterItems():allAudio();$('audioResultCount').textContent=`${items.length} 个`;const rows=$('audioRows');rows.replaceChildren();items.forEach(item=>{const active=item.ti===state.audioTrack&&item.si===state.audioSegment,r=document.createElement('div');r.className=`table-row${active?' active':''}`;r.innerHTML=`<div class="row-main"><button class="row-play"><span class="icon">&#xF04B;</span></button><div><div class="row-name">${esc(item.track.display_name)}</div><div class="row-sub">${esc(item.segment.label)} · ${time(item.segment.start)}–${time(item.segment.end)}</div></div></div><div class="cell">${esc(item.segment.fine_emotions.slice(0,3).join(' · '))}</div><div class="cell">${esc(item.segment.intensity)}</div><div class="cell">${esc(item.segment.scenes.join('、'))}</div><div class="cell"><span class="badge">${esc(item.segment.voiceover_fit)}</span></div>`;r.onclick=()=>selectAudio(item,false);r.querySelector('button').onclick=e=>{e.stopPropagation();selectAudio(item,true)};rows.appendChild(r)})}
function updateAudio(){const current=audioCurrent();if(!current)return;const total=duration(current.track.duration),t=Number.isFinite(audio.currentTime)?audio.currentTime:0,p=Math.max(0,Math.min(100,t/total*100));$('audioTime').textContent=time(t);$('audioSeek').value=String(Math.round(p*10));$('audioPlayhead').style.left=`${p}%`;$('audioOverviewFill').style.width=`${p}%`}
function stepAudio(n){const track=tracks[state.audioTrack],si=Math.max(0,Math.min(track.segments.length-1,state.audioSegment+n));selectAudio({track,segment:track.segments[si],ti:state.audioTrack,si},true)}
function empty(icon,title,copy){return `<div class="empty"><div><div class="empty-icon"><span class="icon">${icon}</span></div><h2>${esc(title)}</h2><p>${copy}</p></div></div>`}
function videoCurrent(){const video=videos[state.videoIndex];return video?{video,segment:video.segments[state.videoSegment]}:null}
function selectVideo(item,play=false){state.videoIndex=item.vi;state.videoSegment=item.si;renderVideo();renderQueue();const el=$('videoPlayer');if(!el)return;const go=()=>{el.currentTime=item.segment.start;if(play)el.play().catch(()=>toast('请手动点击视频播放'))};if(el.readyState<2)el.addEventListener('loadeddata',go,{once:true});else go()}
function renderVideo(){const host=$('videoContent');if(!videos.length){host.innerHTML=empty('&#xF03D;','还没有视频素材','把视频放进 <code>01_视频</code>，运行整理 Skill 后即可按镜头片段筛选和预览。');return}const {video,segment}=videoCurrent(),total=duration(video.duration);host.innerHTML=`<div class="card"><div class="card-head"><div><div class="title">${esc(video.display_name)}</div><div class="sub">${esc(video.category)}　${esc(video.orientation||'方向待确认')}　${esc(video.resolution||'分辨率待确认')}　${esc(video.duration)}</div></div></div><div class="video-stage"><div class="video-box"><video id="videoPlayer" src="${esc(video.relative_path)}" controls preload="metadata"></video></div><aside class="video-side"><div class="detail-title">当前镜头 · ${esc(segment.label)}</div><div class="detail-list"><div class="detail-row"><label>时间范围</label><div>${time(segment.start)}–${time(segment.end)}</div></div><div class="detail-row"><label>内容</label><div>${esc(segment.content_tags.join('、'))}</div></div><div class="detail-row"><label>景别 / 运镜</label><div>${esc(segment.shot_type)} · ${esc(segment.camera_motion)}</div></div><div class="detail-row"><label>剪辑用途</label><div>${esc(segment.uses.join('、'))}</div></div><div class="detail-row"><label>标注</label><div>${esc(segment.annotation||'待确认')}</div></div></div></aside></div><div class="video-timeline" id="videoTimeline"></div></div><div class="section-head"><div class="section-title">视频片段结果 <span>${filterItems().length} 个</span></div></div><div class="table"><div class="table-head"><div>视频 / 片段</div><div>内容</div><div>景别</div><div>用途</div><div>时长</div></div><div id="videoRows"></div></div>`;const timeline=$('videoTimeline');video.segments.forEach((s,i)=>{const c=colors[i%colors.length],b=document.createElement('button');b.className=`video-segment${i===state.videoSegment?' active':''}`;b.style.width=`${(s.end-s.start)/total*100}%`;b.style.setProperty('--seg',c.s);b.style.setProperty('--seg-bg',c.b);b.innerHTML=`${esc(s.label)}<span>${time(s.start)}–${time(s.end)}</span>`;b.onclick=()=>selectVideo({video,segment:s,vi:state.videoIndex,si:i},true);timeline.appendChild(b)});const player=$('videoPlayer');player.addEventListener('timeupdate',()=>{const s=videoCurrent().segment;if(player.currentTime>=s.end-.04){player.pause();player.currentTime=s.end}});const rows=$('videoRows');filterItems().forEach(item=>{const active=item.vi===state.videoIndex&&item.si===state.videoSegment,r=document.createElement('div');r.className=`table-row${active?' active':''}`;r.innerHTML=`<div class="row-main"><button class="row-play"><span class="icon">&#xF04B;</span></button><div><div class="row-name">${esc(item.video.display_name)}</div><div class="row-sub">${esc(item.segment.label)} · ${time(item.segment.start)}–${time(item.segment.end)}</div></div></div><div class="cell">${esc(item.segment.content_tags.join(' · '))}</div><div class="cell">${esc(item.segment.shot_type)}</div><div class="cell">${esc(item.segment.uses.join('、'))}</div><div class="cell">${time(item.segment.end-item.segment.start)}</div>`;r.onclick=()=>selectVideo(item,false);r.querySelector('button').onclick=e=>{e.stopPropagation();selectVideo(item,true)};rows.appendChild(r)})}
function renderImages(){const host=$('imageContent');if(!images.length){host.innerHTML=empty('&#xF03E;','还没有图片素材','把图片放进 <code>02_图片</code>，运行整理 Skill 后即可查看内容、放大预览和按用途筛选。');return}const items=filterItems();host.innerHTML=`<div class="section-head" style="margin-top:0"><div class="section-title">图片内容 <span>${items.length} 张</span></div></div><div class="image-grid" id="imageGrid"></div>`;const grid=$('imageGrid');items.forEach(({image})=>{const b=document.createElement('button');b.className='image-card';b.innerHTML=`<div class="thumb"><img src="${esc(image.relative_path)}" alt="${esc(image.display_name)}" loading="lazy"></div><div class="image-copy"><div class="image-name">${esc(image.display_name)}</div><div class="image-tags">${esc(image.content_tags.join(' · '))}</div><div class="image-meta"><span>${esc(image.category)}</span><span>${esc(image.orientation||'方向待确认')}</span></div></div>`;b.onclick=()=>openImage(image);grid.appendChild(b)})}
function openImage(image){$('lightboxImage').src=image.relative_path;$('lightboxImage').alt=image.display_name;$('lightboxTitle').textContent=image.display_name;$('lightboxMeta').textContent=`${image.category} · ${image.size||`${image.width||'?'}×${image.height||'?'}`} · ${image.orientation||'方向待确认'}`;$('lightboxDetails').innerHTML=`<div class="detail-row"><label>内容标签</label><div class="tag-list">${image.content_tags.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div></div><div class="detail-row"><label>适用场景</label><div class="tag-list">${image.uses.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div></div><div class="detail-row"><label>主要颜色</label><div>${esc((image.colors||[]).join('、')||'待确认')}</div></div><div class="detail-row"><label>备注</label><div>${esc(image.notes||'无')}</div></div>`;$('lightbox').classList.add('open')}
function renderCurrent(){if(state.mode==='audio')renderAudio();else if(state.mode==='video')renderVideo();else renderImages();renderQueue()}
document.querySelectorAll('.media-tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('search').oninput=e=>{state.query=e.target.value.trim();renderSidebar();renderCurrent()};$('clearSearch').onclick=()=>{$('search').value='';state.query='';renderSidebar();renderCurrent()};$('closeLightbox').onclick=()=>$('lightbox').classList.remove('open');$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('lightbox').classList.remove('open')};
$('audioPlay').onclick=()=>audio.paused?audio.play().catch(()=>toast('无法播放本地音频')):audio.pause();$('audioPrev').onclick=()=>stepAudio(-1);$('audioNext').onclick=()=>stepAudio(1);$('audioSeek').oninput=e=>{const c=audioCurrent();if(c){audio.currentTime=duration(c.track.duration)*Number(e.target.value)/1000;updateAudio()}};$('audioVolume').oninput=e=>audio.volume=Number(e.target.value);$('audioTimeline').onclick=e=>{const c=audioCurrent(),r=$('audioTimeline').getBoundingClientRect();audio.currentTime=duration(c.track.duration)*Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));updateAudio()};$('audioOverview').onclick=e=>{const c=audioCurrent(),r=$('audioOverview').getBoundingClientRect();audio.currentTime=duration(c.track.duration)*Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));updateAudio()};
audio.volume=.8;audio.addEventListener('play',()=>$('audioPlayIcon').innerHTML='&#xF04C;');audio.addEventListener('pause',()=>$('audioPlayIcon').innerHTML='&#xF04B;');audio.addEventListener('timeupdate',()=>{const c=audioCurrent();if(c&&$('audioOnly').checked&&audio.currentTime>=c.segment.end-.04){if($('audioLoop').checked){audio.currentTime=c.segment.start;audio.play()}else{audio.pause();audio.currentTime=c.segment.end}}updateAudio()});audio.addEventListener('error',()=>toast('音频加载失败，请确认素材库目录没有改变'));
$('audioCopy').onclick=async()=>{const c=audioCurrent(),textValue=`${c.track.display_name}｜${time(c.segment.start)}–${time(c.segment.end)}｜${c.segment.label}｜${c.segment.uses.join('、')}`;try{await navigator.clipboard.writeText(textValue);toast('片段信息已复制')}catch{toast('当前文件权限不允许自动复制')}};$('audioSave').onclick=()=>toast('已标记当前片段');window.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').classList.remove('open');if(e.code==='Space'&&state.mode==='audio'&&!e.target.matches('input,select')){e.preventDefault();$('audioPlay').click()}});let resize;window.addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(()=>{if(state.mode==='audio')renderAudio()},120)});
$('audioCount').textContent=`${tracks.length} 首`;$('videoCount').textContent=`${videos.length} 个`;$('imageCount').textContent=`${images.length} 张`;if(tracks.length)audio.src=tracks[0].relative_path;renderSidebar();renderCurrent();
</script>
</body>
</html>
